name: Download Logos and Commit

on:
  workflow_dispatch: {}

jobs:
  download-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pillow cairosvg || true

      - name: Run logos script
        run: |
          python logos.py

      - name: Show logos folder summary
        run: |
          echo "Logos saved to ./logos (listing up to 200 files):"
          ls -lh logos || true

      - name: Commit and push logos
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update logos (generated by workflow)"
          file_pattern: "logos/*"
          branch: ${{ github.ref_name }}
