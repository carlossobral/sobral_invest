name: Atualizar Dados SOBRAL Invest

on:
  schedule:
    - cron: '0 1 * * *'  # 4h UTC = 1h BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Garante permissão de write

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          echo "✅ Dependências instaladas"

      - name: Criar pasta data se nao existir
        run: |
          mkdir -p data
          echo "✅ Pasta data/ criada/verificada"

      - name: Coletar dados MFinance
        run: |
          echo "🚀 Iniciando coleta de dados..."
          python app.py
          echo "✅ Coleta finalizada"
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          USEBOLSAI_TOKEN: ${{ secrets.USEBOLSAI_TOKEN }}
          USE_YFINANCE: "false"

      - name: Verificar estrutura de arquivos
        run: |
          echo "🔍 Debug: Estrutura de diretórios"
          pwd
          ls -lah
          ls -lah data/ || echo "⚠️ Pasta data/ não encontrada"
          echo "📄 Tamanho dos arquivos:"
          [ -f "data/ativos.xlsx" ] && stat -c%s "data/ativos.xlsx" || echo "❌ ativos.xlsx não existe"
          [ -f "data/ativos.csv" ] && stat -c%s "data/ativos.csv" || echo "❌ ativos.csv não existe"

      - name: Commit e push (BLINDADO)
        run: |
          # Configurar Git com autenticação explícita
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Configurar remote com token para autenticação
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Forçar add com -f para ignorar regras de encoding/binário
          git add -f data/ativos.xlsx data/ativos.csv data/selic.json data/listagem.json 2>/dev/null || true
          
          # Verificar mudanças POR ARQUIVO (não globalmente) + fallback por tamanho > 0
          CHANGED=0
          for file in data/ativos.xlsx data/ativos.csv data/selic.json data/listagem.json; do
            if [ -f "$file" ] && [ $(stat -c%s "$file" 2>/dev/null || echo 0) -gt 0 ]; then
              # Se arquivo existe e tem tamanho > 0, força commit
              CHANGED=1
              echo "📄 $file: $(stat -c%s "$file") bytes - será commitado"
              break
            fi
          done
          
          if [ $CHANGED -eq 0 ]; then
            echo "⚠️ Nenhum arquivo com conteúdo válido para commit"
            echo "✅ Workflow concluído sem alterações"
            exit 0
          fi
          
          echo "📦 Criando commit..."
          git commit -m "📊 Dados atualizados - $(date +'%Y-%m-%d %H:%M')"
          
          # Push com tratamento de conflitos robusto (fetch + merge em vez de pull --rebase)
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔄 Push: tentativa $i/$MAX_RETRIES"
            
            # Fetch + merge é mais tolerante que pull --rebase com unstaged changes
            git fetch origin main 2>/dev/null || true
            if ! git merge origin/main --no-edit 2>/dev/null; then
              echo "⚠️ Merge com conflitos, tentando push mesmo assim..."
            fi
            
            if git push origin main; then
              echo "✅ Push realizado com SUCESSO!"
              exit 0
            else
              echo "❌ Push falhou na tentativa $i"
              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ ERRO CRÍTICO: Push falhou após $MAX_RETRIES tentativas"
                echo "🔍 Verifique: permissões do token, branch protegida, ou conflitos"
                exit 1
              fi
              echo "⏳ Aguardando 5s antes da próxima tentativa..."
              sleep 5
            fi
          done

      - name: Resumo Final
        if: always()
        run: |
          echo "=========================================="
          echo "📋 RESUMO DO WORKFLOW"
          echo "=========================================="
          echo "📁 Diretório: $(pwd)"
          echo "📂 Arquivos em data/:"
          ls -lh data/ 2>/dev/null || echo "⚠️ Pasta data/ vazia ou inexistente"
          echo ""
          if [ -f "data/ativos.xlsx" ]; then
            SIZE=$(stat -c%s "data/ativos.xlsx")
            echo "✅ data/ativos.xlsx: $SIZE bytes"
          else
            echo "❌ data/ativos.xlsx NÃO encontrado"
          fi
          if [ -f "data/ativos.csv" ]; then
            SIZE=$(stat -c%s "data/ativos.csv")
            echo "✅ data/ativos.csv: $SIZE bytes"
          else
            echo "❌ data/ativos.csv NÃO encontrado"
          fi
          echo "=========================================="
