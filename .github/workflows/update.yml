name: Atualizar Dados SOBRAL Invest

on:
  schedule:
    - cron: '0 6 * * *'  # 6h UTC = 3h BRT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Atualizar SELIC
        run: |
          python - <<'EOF'
          import requests
          import json
          import os
          from datetime import date

          URL = "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json"

          try:
              r = requests.get(URL, timeout=15)
              r.raise_for_status()
              dados = r.json()

              valor_str = dados[0]["valor"]
              valor = float(valor_str)

              # Detecção automática: < 1.0 = diária, >= 1.0 = anual
              if valor < 1.0:
                  selic = round((valor / 100) * 252 * 100, 2)
              else:
                  selic = round(valor, 2)

              if 2.0 <= selic <= 30.0:
                  payload = {"selic": selic, "data": str(date.today())}
                  with open("selic.json", "w", encoding="utf-8") as f:
                      json.dump(payload, f)
                  print(f"✅ SELIC atualizada: {selic}%")
              else:
                  raise ValueError(f"SELIC fora do intervalo: {selic}%")

          except Exception as e:
              print(f"⚠️ Erro ao buscar SELIC: {e}")
              if os.path.exists("selic.json"):
                  print("⚠️ Mantendo selic.json anterior")
              else:
                  fallback = {"selic": 10.75, "data": str(date.today()), "fallback": True}
                  with open("selic.json", "w", encoding="utf-8") as f:
                      json.dump(fallback, f)
                  print("⚠️ Criado selic.json com fallback: 10.75%")
          EOF

      - name: Coletar dados MFinance
        run: |
          python app.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          USEBOLSAI_TOKEN: ${{ secrets.USEBOLSAI_TOKEN }}

      - name: Verificar e commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verificar se ativos.xlsx foi gerado e não está vazio
          if [ ! -f "ativos.xlsx" ]; then
            echo "❌ ativos.xlsx não foi gerado!"
            exit 1
          fi

          # Verificar tamanho mínimo (cabeçalho = ~2KB)
          SIZE=$(stat -c%s "ativos.xlsx")
          if [ $SIZE -lt 5000 ]; then
            echo "❌ ativos.xlsx muito pequeno ($SIZE bytes) - provavelmente vazio!"
            exit 1
          fi

          echo "✅ ativos.xlsx: $SIZE bytes"

          # Commit seletivo
          git add ativos.xlsx ativos.csv selic.json

          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança para commitar"
          else
            git commit -m "📊 Dados atualizados - $(date +'%Y-%m-%d %H:%M')"

            # Retry push (3 tentativas)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "⚠️ Push falhou, tentativa $i/3..."
              sleep 5
            done
          fi

      - name: Resumo
        if: always()
        run: |
          echo "=========================================="
          echo "RESUMO DO WORKFLOW"
          echo "=========================================="
          if [ -f "ativos.xlsx" ]; then
            SIZE=$(stat -c%s "ativos.xlsx")
            echo "✅ ativos.xlsx: $SIZE bytes"
          else
            echo "❌ ativos.xlsx não encontrado"
          fi
          if [ -f "selic.json" ]; then
            echo "✅ selic.json: $(cat selic.json)"
          else
            echo "❌ selic.json não encontrado"
          fi
          echo "=========================================="
