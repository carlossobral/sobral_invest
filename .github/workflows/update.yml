name: Atualizar Planilha Sobral Invest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 03:00 BRT (UTC-3)

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Buscar taxa Selic (API Banco Central)
        id: selic
        run: |
          python - <<'EOF'
          import requests
          import json
          import os
          from datetime import date

          URL = "https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json"

          try:
              r = requests.get(URL, timeout=15)
              r.raise_for_status()
              dados = r.json()

              # A API retorna a taxa diária como STRING PERCENTUAL
              # Exemplo: "0.043647" significa 0.043647% ao dia
              # Para converter para anual: (taxa_diaria / 100) * 252
              selic_diaria_str = dados[0]["valor"]
              selic_diaria_pct = float(selic_diaria_str)  # 0.043647
              selic_diaria_decimal = selic_diaria_pct / 100  # 0.00043647
              selic_anual = round(selic_diaria_decimal * 252 * 100, 2)  # 10.99%

              # Validação: SELIC anual deve estar entre 2% e 30%
              if not (2.0 <= selic_anual <= 30.0):
                  raise ValueError(f"SELIC anual fora do intervalo: {selic_anual}%")

              payload = {"selic": selic_anual, "data": str(date.today())}
              with open("selic.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f)

              print(f"✅ SELIC atualizada: {selic_anual}% a.a. ({date.today()})")

          except Exception as e:
              print(f"⚠️ Erro ao buscar SELIC: {e}")

              # Mantém anterior ou cria fallback
              if os.path.exists("selic.json"):
                  print("⚠️ Mantendo selic.json anterior")
              else:
                  fallback = {"selic": 13.25, "data": str(date.today()), "fallback": True}
                  with open("selic.json", "w", encoding="utf-8") as f:
                      json.dump(fallback, f)
                  print("⚠️ Criado selic.json com fallback: 13.25%")
          EOF

      - name: Executar coletor de dados
        id: coletor
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          USEBOLSAI_API_KEY: ${{ secrets.USEBOLSAI_API_KEY }}
        run: |
          echo "🚀 Iniciando coleta de dados..."
          python app.py
          echo "✅ Coleta finalizada"

      - name: Verificar arquivos gerados
        id: verificar
        run: |
          if [ -f "ativos.xlsx" ]; then
            echo "✅ ativos.xlsx encontrado"
            ls -lh ativos.xlsx
          else
            echo "❌ ativos.xlsx NÃO encontrado"
            exit 1
          fi

          if [ -f "ativos.csv" ]; then
            echo "✅ ativos.csv encontrado"
            ls -lh ativos.csv
          fi

      - name: Commit arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ativos.xlsx ativos.csv selic.json

          if git diff --cached --quiet; then
            echo "ℹ️ Nenhuma mudança detectada"
            exit 0
          fi

          git commit -m "🤖 Atualização automática - $(date +'%Y-%m-%d %H:%M')"

          for i in 1 2 3; do
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main && break
            echo "⚠️ Tentativa $i falhou, retry..."
            sleep 5
          done

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          echo "✅ Push realizado com sucesso"

      - name: Resumo da execução
        if: always()
        run: |
          echo "=========================================="
          echo "📊 RESUMO DA EXECUÇÃO"
          echo "=========================================="
          echo "Data: $(date)"
          echo "Status SELIC: ${{ steps.selic.outcome }}"
          echo "Status Coletor: ${{ steps.coletor.outcome }}"
          echo "Status Verificação: ${{ steps.verificar.outcome }}"

          if [ -f "ativos.xlsx" ]; then
            echo "Tamanho ativos.xlsx: $(ls -lh ativos.xlsx | awk '{print $5}')"
          fi
          echo "=========================================="
