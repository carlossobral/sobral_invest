name: Atualizar Planilha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Atualizar branch local
        run: |
          git pull origin main --rebase

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar aplicação
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          python app.py

      - name: Commit arquivos atualizados
        run: |

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git rm -r --cached __pycache__ || true

          git add .

          git diff --cached --quiet || git commit -m "Atualização automática"

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
