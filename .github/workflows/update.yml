name: Atualizar Dados SOBRAL Invest

on:
  schedule:
    - cron: '0 4 * * *'  # 4h UTC = 1h BRT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Coletar dados MFinance
        run: |
          python app.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          USEBOLSAI_TOKEN: ${{ secrets.USEBOLSAI_TOKEN }}

      - name: Verificar e commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verificar se ativos.xlsx foi gerado na pasta data/
          if [ ! -f "data/ativos.xlsx" ]; then
            echo "❌ data/ativos.xlsx não foi gerado!"
            exit 1
          fi

          # Verificar tamanho mínimo
          SIZE=$(stat -c%s "data/ativos.xlsx")
          if [ $SIZE -lt 5000 ]; then
            echo "❌ data/ativos.xlsx muito pequeno ($SIZE bytes) - provavelmente vazio!"
            exit 1
          fi

          echo "✅ data/ativos.xlsx: $SIZE bytes"

          # Commit seletivo
          git add data/ativos.xlsx data/ativos.csv data/selic.json

          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança para commitar"
          else
            git commit -m "📊 Dados atualizados - $(date +'%Y-%m-%d %H:%M')"

            # Retry push (3 tentativas)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "⚠️ Push falhou, tentativa $i/3..."
              sleep 5
            done
          fi

      - name: Resumo
        if: always()
        run: |
          echo "=========================================="
          echo "RESUMO DO WORKFLOW"
          echo "=========================================="
          if [ -f "data/ativos.xlsx" ]; then
            SIZE=$(stat -c%s "data/ativos.xlsx")
            echo "✅ data/ativos.xlsx: $SIZE bytes"
          else
            echo "❌ data/ativos.xlsx não encontrado"
          fi
          if [ -f "data/selic.json" ]; then
            echo "✅ data/selic.json: $(cat data/selic.json)"
          else
            echo "❌ data/selic.json não encontrado"
          fi
          echo "=========================================="
